project_id = "actaquito"

[db.seed]
enabled = false

[auth]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true

[functions.invitar-usuario]
entrypoint = "./functions/invitar-usuario/index.mjs"
# El endpoint valida el token con Supabase Auth antes de procesar el cuerpo.
verify_jwt = true

[functions.enviar-evidencia-acta]
entrypoint = "./functions/enviar-evidencia-acta/index.mjs"
# La función valida el JWT y reenvía la identidad a la RPC que controla el alcance.
verify_jwt = true

[functions.descargar-evidencia-acta]
entrypoint = "./functions/descargar-evidencia-acta/index.mjs"
verify_jwt = true
